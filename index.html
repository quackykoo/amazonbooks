<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quackykoo Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1, h2 { text-align: center; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .card h3 { font-size: 1.1rem; margin-top: 0; }
        .card p { font-size: 0.9rem; color: #666; flex-grow: 1; }
        .btn {
            display: block;
            text-align: center;
            background-color: #ff9900;
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn.newsletter { background-color: #222; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>Quackykoo Portfolio</h1>

    <h2>Latest Newsletter Issues</h2>
    <div class="grid" id="newsletterGrid">
        <p style="text-align:center; grid-column: 1/-1;">Loading latest newsletters...</p>
    </div>

    <h2>My Books</h2>
    <div class="grid" id="bookGrid">
        <p style="text-align:center; grid-column: 1/-1;">Loading books...</p>
    </div>

    <script>
        // 1. Fetch and Parse Beehiiv RSS Feed
        const rssUrl = 'YOUR_BEEHIIV_RSS_URL_HERE.xml'; 

        fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl))
            .then(response => response.text())
            .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
            .then(data => {
                const items = data.querySelectorAll("item");
                const newsletterGrid = document.getElementById("newsletterGrid");
                newsletterGrid.innerHTML = ""; 

                let count = 0;
                items.forEach(el => {
                    if (count >= 3) return; 
                    const title = el.querySelector("title").textContent;
                    const link = el.querySelector("link").textContent;
                    const description = el.querySelector("description").textContent.replace(/<[^>]*>?/gm, '').substring(0, 100) + '...';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <h3>${title}</h3>
                            <p>${description}</p>
                        </div>
                        <a href="${link}" class="btn newsletter" target="_blank">Read Issue</a>
                    `;
                    newsletterGrid.appendChild(card);
                    count++;
                });
            })
            .catch(err => {
                document.getElementById("newsletterGrid").innerHTML = "<p style='text-align:center;'>Unable to load live newsletters right now.</p>";
            });

        // 2. Fetch books.json and populate grid
        fetch('books.json')
            .then(response => response.json())
            .then(books => {
                const grid = document.getElementById('bookGrid');
                grid.innerHTML = "";
                books.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <img src="${book.coverImage}" alt="${book.title}">
                            <h3>${book.title}</h3>
                            <p>${book.description}</p>
                        </div>
                        <a href="${book.amazonLink}" class="btn" target="_blank">View on Amazon</a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById("bookGrid").innerHTML = "<p style='text-align:center;'>Unable to load books.</p>";
            });
    </script>
</body>
</html>
